[project]
name = "deep-agent-rca"
version = "0.1.0"
description = "Deterministic LangGraph RCA workflow with focused DeepAgents stages"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "click>=8.4.2",
  "deepagents",
  "fastapi>=0.115",
  "langchain-google-genai",
  "langgraph",
  "langgraph-checkpoint-postgres>=3.0",
  "langgraph-checkpoint-sqlite>=3.0",
  "aiosqlite>=0.21",
  "psycopg[binary,pool]>=3.2",
  "psycopg2-binary",
  "pymongo>=4.13",
  "pymysql>=1.1",
  "oracledb>=3.0",
  "pydantic>=2",
  "python-dotenv",
  "rich>=15.0.0",
  "uvicorn[standard]>=0.34",
]

[project.scripts]
deep-agent = "deep_agent.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
