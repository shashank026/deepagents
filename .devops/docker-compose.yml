name: tracex-deepagents

services:
  deepagents:
    container_name: tracex-deepagents
    build:
      context: ..
      dockerfile: .devops/Dockerfile
    env_file:
      - .env
    restart: unless-stopped
    init: true
    expose:
      - "8010"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/health', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    networks:
      tracex:
        aliases:
          - deepagents

networks:
  tracex:
    external: true
    name: tracex-network

